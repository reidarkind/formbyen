name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Nettleserne og systempakkene ligger ferdig i imaget. Versjonen må være lik @playwright/test i package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:skjerm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skjermbilder
          path: |
            test-results
            playwright-report
          retention-days: 14
      - run: npm run build
        env:
          VITE_BYGG: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
